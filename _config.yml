# No `exclude:` here on purpose. Claude Code skills are in the repo but are not
# site content, and SKILL.md carries YAML front matter, so Jekyll would happily
# render one as a published page. It doesn't, because they live under `.claude/`
# and Jekyll skips dot directories before `exclude` is ever consulted — verified
# against the deployed site, not assumed:
#
#   GET /.claude/skills/post-writer/SKILL.html -> 404
#
# The entry that used to be here named `skills/`, a path that stopped existing
# when the skills moved; it was doing nothing. If they ever move back to a
# visible path, an `exclude:` has to come back with them.
